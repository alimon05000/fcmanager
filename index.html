<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#05070a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="manifest" href="manifest.json">
    <title>RPL MANAGER 26/27</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="css/style.css">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        fc: { bg: '#05070a', card: '#0f141e', text: '#f8fafc' },
                        club: 'var(--club-main)',
                        clubsec: 'var(--club-sec)'
                    }
                }
            }
        }
    </script>
</head>
<body class="flex justify-center w-full h-screen bg-fc-bg text-fc-text overflow-hidden">

    <div id="app" class="w-full max-w-md h-screen flex flex-col relative transition-all duration-300">
        
        <div id="screen-setup" class="screen active flex-col h-full w-full p-6 pt-12 z-50">
            <h2 class="text-3xl font-black mb-1">РПЛ 26/27</h2>
            <p class="text-xs text-gray-400 mb-6">Создание карьеры</p>

            <div class="mb-4 shrink-0">
                <input type="text" id="manager-name" placeholder="Имя Менеджера" class="w-full bg-white/5 border border-white/10 rounded-xl p-4 text-sm font-bold text-white focus:border-blue-500 transition-all outline-none">
            </div>

            <div class="flex-1 overflow-y-auto grid grid-cols-2 gap-3 pb-2" id="club-grid"></div>

            <div class="shrink-0 pt-4 pb-6">
                <button onclick="startCareer()" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-black py-4 rounded-xl shadow-[0_0_20px_rgba(37,99,235,0.4)] transition-all active:scale-95 text-sm tracking-wider">
                    ПОДПИСАТЬ КОНТРАКТ
                </button>
            </div>
        </div>

        <div id="screen-main" class="screen flex-col h-full w-full">
            <header class="glass-panel px-5 py-4 flex justify-between items-center z-30 shrink-0">
                <div class="flex items-center gap-3">
                    <img id="hub-logo" src="" class="w-10 h-10 object-contain drop-shadow-lg" alt="logo">
                    <div>
                        <h1 class="text-sm font-black text-white" id="hub-name">Клуб</h1>
                        <p class="text-[10px] text-gray-400">Тренер: <span id="hub-manager" class="text-white"></span></p>
                    </div>
                </div>
                <div class="text-right">
                    <div class="text-club font-bold text-sm" id="hub-budget">€0M</div>
                    <p class="text-[9px] font-bold text-gray-400 mt-1 uppercase">Тур <span id="hub-matchday" class="text-white">1</span> / 30</p>
                </div>
            </header>

            <main id="main-content" class="flex-1 overflow-y-auto px-4 py-5 pb-24 z-10 relative">
                <section id="tab-home" class="tab-content active space-y-4">
                    <div class="glass-panel p-5 rounded-2xl relative overflow-hidden shadow-club">
                        <div class="absolute -right-10 -top-10 w-32 h-32 bg-club/20 rounded-full blur-3xl"></div>
                        <span class="text-[10px] font-bold text-white bg-white/10 px-2 py-1 rounded">СЛЕДУЮЩИЙ МАТЧ</span>
                        
                        <div class="flex justify-between items-center mt-5 mb-6">
                            <div class="text-center w-2/5">
                                <img id="match-home-logo" class="h-12 mx-auto mb-2 object-contain" alt="home">
                                <p class="text-xs font-black truncate" id="match-home-team">Клуб 1</p>
                            </div>
                            <div class="text-center w-1/5"><span class="text-xs font-black text-gray-500">VS</span></div>
                            <div class="text-center w-2/5">
                                <img id="match-away-logo" class="h-12 mx-auto mb-2 object-contain" alt="away">
                                <p class="text-xs font-black truncate" id="match-away-team">Клуб 2</p>
                            </div>
                        </div>
                        
                        <button onclick="playMatchday()" class="w-full bg-club text-black font-black py-3.5 rounded-xl transition-all active:scale-95 text-xs tracking-wider">
                            ИГРАТЬ МАТЧ
                        </button>
                    </div>
                </section>
                
                <section id="tab-squad" class="tab-content h-full">
                    <div class="flex justify-between items-center mb-2 px-1">
                        <span class="text-[10px] font-bold text-gray-400">РАССТАНОВКА ОСНОВЫ</span>
                    </div>
                    <div class="pitch-container mb-4" id="pitch-view"></div>
                    <span class="text-[10px] font-bold text-gray-400 px-1">ЗАПАСНЫЕ</span>
                    <div id="bench-view" class="grid grid-cols-1 gap-2 mt-2"></div>
                </section>
                
                <section id="tab-table" class="tab-content space-y-5">
                    <div class="glass-panel rounded-2xl p-3">
                        <h3 class="text-xs font-bold text-gray-400 mb-3 text-center">ТУРНИРНАЯ ТАБЛИЦА</h3>
                        <div id="standings-body" class="text-xs font-medium space-y-1"></div>
                    </div>
                </section>
            </main>

            <nav id="bottom-nav" class="absolute bottom-0 w-full glass-panel px-2 pt-2 pb-6 z-40 shrink-0">
                <ul class="flex justify-around items-center">
                    <li onclick="switchTab('home', this)" class="nav-item flex flex-col items-center cursor-pointer text-club w-1/3">
                        <i data-lucide="home" class="w-5 h-5 mb-1"></i><span class="text-[9px] font-bold">Офис</span>
                    </li>
                    <li onclick="switchTab('squad', this)" class="nav-item flex flex-col items-center cursor-pointer text-gray-500 w-1/3">
                        <i data-lucide="users" class="w-5 h-5 mb-1"></i><span class="text-[9px] font-bold">Состав</span>
                    </li>
                    <li onclick="switchTab('table', this)" class="nav-item flex flex-col items-center cursor-pointer text-gray-500 w-1/3">
                        <i data-lucide="bar-chart-3" class="w-5 h-5 mb-1"></i><span class="text-[9px] font-bold">Таблица</span>
                    </li>
                </ul>
            </nav>
        </div>
    </div>

    <script src="js/db.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
